[package]
name = "app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
gpui = "0.2.2"
gpui-component = { version = "0.5.1", features = ["tree-sitter-languages"] }
gpui-component-assets = "0.5.1"
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
lsp-types = "0.97.0"
url = "2"
async-channel = "2"
portable-pty = "0.8"
notify = "7"
alacritty_terminal = "0.25.1"
gpui-terminal = "0.1.0"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
fuzzy-matcher = "0.3.7"
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux has no icon resource inside the binary: the desktop entry, the hicolor
# icon theme and (on X11) `_NET_WM_ICON` are what a panel reads. `image` is
# restricted to the PNG codec because the embedded logo is already a PNG --
# pulling in every decoder would cost build time and binary size for nothing.
# `raw-window-handle` is only used to read the window id out of a GPUI `Window`;
# `x11rb` opens a second connection to `$DISPLAY` because GPUI's `display_handle`
# is unimplemented on X11.
[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
x11rb = "0.13"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# `test-support` is what makes TestAppContext able to actually render: without it
# the test platform has a no-op text system and throws every Scene away, so
# VisualTestContext::draw cannot return pixels. It is a dev-dependency feature on
# purpose -- the shipped binary must not pay for leak detection.
[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
image = "0.25"

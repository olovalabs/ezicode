[package]
name = "app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = []
# Experimental: load and run compiled extension WASM components (see
# app/src/extension/wasm.rs). Pulls in wasmtime + WASI.
wasm-extensions = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
anyhow = "1"
gpui = "0.2.2"
gpui-component = { version = "0.5.1", features = ["tree-sitter-languages"] }
gpui-component-assets = "0.5.1"
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Optional host for running compiled Zed extension logic (`extension.wasm`).
# Off by default: keeps the standard build free of the heavy wasmtime tree.
# Enable with `cargo run --features wasm-extensions`.
wasmtime = { version = "27", optional = true, default-features = false, features = [
    "cranelift",
    "component-model",
    "runtime",
] }
wasmtime-wasi = { version = "27", optional = true }
rfd = "0.15"
lsp-types = "0.97.0"
url = "2"
async-channel = "2"
portable-pty = "0.8"
notify = "7"
alacritty_terminal = "0.25.1"
gpui-terminal = "0.1.0"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
fuzzy-matcher = "0.3.7"
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

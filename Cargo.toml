[workspace]
members = ["app"]
# components/gpui is a patched-in vendored crate, not a package we build or
# test directly: its own examples/tests would otherwise be pulled into the
# workspace and `cargo test` would try to run them.
exclude = ["components/gpui"]
resolver = "2"

# GPUI + tree-sitter are extremely slow in unoptimized debug builds.
# Zed ships release; this keeps `cargo run` usable on large files.
[profile.dev.package."*"]
opt-level = 2

# Release builds ship like Zed's: full optimizations, one codegen unit and
# LTO so the LLVM backend can inline across the GPUI/tree-sitter boundary.
# Costs build time, not runtime — exactly the trade Zed makes.
[profile.release]
lto = "thin"
codegen-units = 1

# Vendored copy of gpui-component 0.5.1 with fixes for two highlight-range
# crashes (see components/gpui-component/src/input/element.rs and
# popovers/completion_menu.rs): ranges ending one byte past the text tripped
# GPUI's `debug_assert!(text.is_char_boundary(run.end))` and closed the app
# while editing or using the completion menu. Keep this patch until upstream
# ships the fixes.
#
# Vendored copy of gpui 0.2.2 plus headless rendering: upstream's test platform
# throws the scene away, so no test can ever see a pixel. See
# components/gpui/VENDORED.md for the patch list.
[patch.crates-io]
gpui = { path = "components/gpui" }
gpui-component = { path = "components" }
gpui-terminal = { path = "gpui-terminal" }

# As a path dependency it would otherwise build at opt-level 0 and the whole
# editor would feel sluggish — keep it optimized like the other deps.
[profile.dev.package.gpui-component]
opt-level = 2

[profile.dev.package.gpui-terminal]
opt-level = 2

[profile.dev.package.app]
opt-level = 2
